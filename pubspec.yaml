name: maxai
description: MaxAI is an Android-first offline AI chat application using local GGUF models.
publish_to: "none"
version: 1.0.5+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Persistent Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Local AI Inference (Android)
  llama_flutter_android: ^0.2.0

  # Networking
  dio: ^5.7.0
  http: ^1.2.0
  crypto: ^3.0.7

  # File System
  path_provider: ^2.1.0

  # Image Support
  image_picker: ^1.1.0
  share_plus: ^10.0.0

  # UI
  google_fonts: ^6.2.0
  flutter_markdown: ^0.7.4

  # Utils
  uuid: ^4.5.0
  file_picker: ^11.0.2
  image: ^4.8.0
  gal: ^2.3.2
  syncfusion_flutter_pdf: ^33.2.6
  speech_to_text: 7.3.0
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  llama_flutter_android:
    path: local_plugins/llama_flutter_android

flutter:
  uses-material-design: true

  assets:
    - assets/icons/appicon.png
    - assets/splash/launch_artwork.png
